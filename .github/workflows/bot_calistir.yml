name: Gunluk AI Trade Motoru

on:
  schedule:
    - cron: "15 0 * * *"      # her gün 00:15 UTC = 03:15 TSİ (BTC günlük mumu 00:00 UTC'de kapanır)
  workflow_dispatch:           # Actions sekmesinden elle çalıştırmak için

permissions:
  contents: write              # motor cüzdan dosyasını aynı depoya yazar; ayrı bir token gerekmez

concurrency:
  group: motor
  cancel-in-progress: false

jobs:
  calistir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Kutuphaneler
        run: pip install pandas numpy requests yfinance xgboost scikit-learn vaderSentiment
      - name: Motor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PYTHONUNBUFFERED: "1"
        run: python motor.py
